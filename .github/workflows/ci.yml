name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Browser persistence smoke
        run: npm run test:e2e
      - name: Browser smoke
        run: |
          npm exec -- vite preview --host 127.0.0.1 > /tmp/vite-preview.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --hide-scrollbars --screenshot=desktop.png --window-size=1440,1000 http://127.0.0.1:4173/
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --hide-scrollbars --screenshot=mobile.png --window-size=390,844 http://127.0.0.1:4173/
      - name: Upload browser smoke screenshots
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: |
            desktop.png
            mobile.png
          if-no-files-found: error
